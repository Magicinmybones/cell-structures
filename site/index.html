/* ---------- design tokens (reference px; --u converts to screen px) ---------- */

/* =====================================================================

   Desktop composition (above) stays active while it can still hold:
     - scale u >= .58  ->  min-width 920px (1586*.58) and min-height 575px (992*.58);
       below that the specimen drawings drop under ~200px cells
     - aspect >= 6/5  ->  beyond this the cells turn hollow (h/w > 1.3)

   ===================================================================== */
@media not all and (min-aspect-ratio:6/5) and (min-width:920px) and (min-height:575px){
  body{overflow:visible}
  :root{--t:clamp(.78px, min(100vw / 768, 100dvh / 1024), 1.3px)}

    overflow:visible}
  .intro{display:contents}
  .brand{grid-area:brand;position:relative;display:flex;align-items:center;align-self:center;gap:calc(11 * var(--t));
    height:calc(41 * var(--t));justify-self:start}
  .mark{position:static;width:calc(32 * var(--t));height:calc(41 * var(--t));flex:none}
  .word{position:static;font-size:calc(32.9375 * var(--t));line-height:1;letter-spacing:calc(-1.62 * var(--t));margin-top:calc(-4 * var(--t))}
  .chip,.title,.lede,.url{position:static}
  .chip{grid-area:chip;justify-self:start;align-self:end;margin-top:calc(46 * var(--t));height:calc(36 * var(--t));
    padding:calc(1.5 * var(--t)) calc(11.6875 * var(--t)) 0;border-radius:calc(3 * var(--t));
    font-size:calc(16.5 * var(--t));letter-spacing:0}
  .title{grid-area:title;align-self:end;margin-top:calc(22 * var(--t));font-size:calc(46 * var(--t));
    letter-spacing:calc(-0.725 * var(--t));white-space:nowrap}
  .lede{grid-area:lede;align-self:end;width:auto;max-width:34ch;margin-bottom:calc(-3 * var(--t));
    font-size:calc(20 * var(--t));line-height:1.36;letter-spacing:0;text-wrap:pretty}
  .url{grid-area:url;justify-self:end;align-self:center;display:inline-block;padding:10px 0;margin:-10px 0;
    font-size:calc(15 * var(--t));letter-spacing:0;text-underline-offset:calc(3 * var(--t))}

  /* specimen grid fills the rest of the viewport; rows never squash below a balanced card */
  .grid{flex:1 0 auto;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:none;
    grid-auto-rows:minmax(calc((100vw - 4px) / 3 * .62), 1fr)}

@media (max-width:37.5em){

  .chip{margin-top:calc(54 * var(--m));height:calc(34 * var(--m));padding:calc(1.5 * var(--m)) calc(11 * var(--m)) 0;
    border-radius:calc(3 * var(--m));font-size:calc(16 * var(--m))}
  .title{margin-top:calc(26 * var(--m));font-size:calc(46 * var(--m));letter-spacing:calc(-.6 * var(--m))}
  .lede{margin:calc(16 * var(--m)) 0 0;max-width:30ch;font-size:calc(19 * var(--m));line-height:1.36}
  .url{margin-top:calc(32 * var(--m));font-size:calc(14.5 * var(--m))}

  .grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(calc((100vw - 3px) / 2 * .9), 1fr)}

  .cell.c0 .art{transform:scale(1.42);transform-origin:47.5% 49%}
